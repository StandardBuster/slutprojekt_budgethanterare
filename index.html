<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Budgethanterare</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="app">

    <aside class="sidebar">
      <div class="logo">
        <span class="logo-text">Budget Manager</span>
      </div>
      <nav class="nav">
        <a class="nav-link active" data-view="dashboard" href="#">
          <span class="nav-icon">◈</span> Overview
        </a>
        <a class="nav-link" data-view="transactions" href="#">
          <span class="nav-icon">≡</span> Transaction
        </a>
        <a class="nav-link" data-view="add" href="#">
          <span class="nav-icon">+</span> Add/ Remove
        </a>
      </nav>
      <div class="sidebar-footer">
        <button class="btn-clear" id="clearData">Clear Cache</button>
      </div>
    </aside>

    <main class="main">

      <section class="view active" id="view-dashboard">
        <header class="view-header">
          <h1>Overview</h1>
          <div class="month-nav">
            <button id="prevMonth">&#8249;</button>
            <span id="currentMonthLabel"></span>
            <button id="nextMonth">&#8250;</button>
          </div>
        </header>

        <div class="summary-cards">
          <div class="card card--income">
            <div class="card-label">Income</div>
            <div class="card-amount" id="totalIncome">0 kr</div>
          </div>
          <div class="card card--expense">
            <div class="card-label">Outcome</div>
            <div class="card-amount" id="totalExpense">0 kr</div>
          </div>
          <div class="card card--balance">
            <div class="card-label">Balance</div>
            <div class="card-amount" id="totalBalance">0 kr</div>
          </div>
        </div>

        <div class="dashboard-grid">
          <div class="panel">
            <h2 class="panel-title">Monthly Overview</h2>
            <canvas id="barChart" height="220"></canvas>
          </div>
          <div class="panel">
            <h2 class="panel-title">Outcome per category</h2>
            <canvas id="pieChart" height="220"></canvas>
            <div class="legend" id="pieLegend"></div>
          </div>
        </div>

        <div class="panel">
          <h2 class="panel-title">Latest transactions</h2>
          <div class="tx-list" id="recentTxList">
            <p class="empty-state">No transactions yet</p>
          </div>
        </div>
      </section>

      <section class="view" id="view-transactions">
        <header class="view-header">
          <h1>Transactions</h1>
          <div class="filter-row">
            <select id="filterType">
              <option value="all">All</option>
              <option value="income">Income</option>
              <option value="expense">Outcome</option>
            </select>
            <select id="filterCategory">
              <option value="all">All categories</option>
            </select>
            <input type="text" id="filterSearch" placeholder="Search..." />
          </div>
        </header>
        <div class="tx-list full" id="allTxList">
          <p class="empty-state">No transactions yet</p>
        </div>
      </section>

      <section class="view" id="view-add">
        <header class="view-header">
          <h1>Add transaction</h1>
        </header>

        <div class="form-card">
          <div class="type-toggle">
            <button class="toggle-btn active" data-type="expense">Outcome</button>
            <button class="toggle-btn" data-type="income">Income</button>
          </div>

          <div class="form-group">
            <label for="txDesc">Description</label>
            <input type="text" id="txDesc" placeholder="E.g. ICA, Salary, Netflix..." />
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="txAmount">Cost (kr)</label>
              <input type="number" id="txAmount" placeholder="0" min="0" step="1" />
            </div>
            <div class="form-group">
              <label for="txDate">Date</label>
              <input type="date" id="txDate" />
            </div>
          </div>

          <div class="form-group">
            <label for="txCategory">Category</label>
            <select id="txCategory"></select>
          </div>

          <div class="form-group">
            <label for="txNote">Notes (voluntary)</label>
            <input type="text" id="txNote" placeholder="Text..." />
          </div>

          <button class="btn-submit" id="submitTx">Add</button>
          <div class="form-feedback" id="formFeedback"></div>
        </div>
      </section>

    </main>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script>

document.addEventListener("DOMContentLoaded", function () {

const CATEGORIES = {
  expense: [
    { id: "groceries",        label: "Groceries", icon: "🛒" },
    { id: "home",     label: "Home & Rent",     icon: "🏠" },
    { id: "transport",  label: "Transportation",          icon: "🚗" },
    { id: "entertainment",       label: "Entertainment & Free Time",     icon: "🎮" },
    { id: "health",      label: "Healthcare",      icon: "💊" },
    { id: "clothes",     label: "Clothing",             icon: "👕" },
    { id: "restaurant", label: "Restaurant & Café",  icon: "🍕" },
    { id: "subscription", label: "Subscription",         icon: "📱" },
    { id: "other",     label: "Other",             icon: "📦" },
  ],
  income: [
    { id: "salary",         label: "Salary",            icon: "💼" },
    { id: "contribution",      label: "Contribution & Support",  icon: "🏦" },
    { id: "freelance",   label: "Freelance Work",  icon: "💻" },
    { id: "investment", label: "Investments",  icon: "📈" },
    { id: "other_in",   label: "Other",         icon: "💰" },
  ],
};

const CATEGORY_COLORS = [
  "#6c63ff","#2dd4aa","#f0657a","#f5a623","#50b8e8",
  "#a78bfa","#34d399","#fb923c","#e879f9","#facc15",
];

let transactions = loadTransactions();
let currentType  = "expense";
let currentYear  = new Date().getFullYear();
let currentMonth = new Date().getMonth();
let barChartInst = null;
let pieChartInst = null;

function loadTransactions() {
  try { return JSON.parse(localStorage.getItem("budget_tx") || "[]"); }
  catch (e) { return []; }
}
function saveTransactions() {
  localStorage.setItem("budget_tx", JSON.stringify(transactions));
}

function formatSEK(amount) {
  return new Intl.NumberFormat("sv-SE", {
    style: "currency", currency: "SEK", maximumFractionDigits: 0
  }).format(amount);
}
function formatDate(dateStr) {
  if (!dateStr) return "";
  const d = new Date(dateStr + "T00:00:00");
  return d.toLocaleDateString("sv-SE", { day: "numeric", month: "short" });
}
function getCategoryInfo(type, id) {
  const list = CATEGORIES[type] || [];
  return list.find(function(c) { return c.id === id; }) || { label: id, icon: "📦" };
}
function monthLabel(year, month) {
  return new Date(year, month, 1)
    .toLocaleDateString("sv-SE", { month: "long", year: "numeric" })
    .replace(/^\w/, function(c) { return c.toUpperCase(); });
}
function txInMonth(tx, year, month) {
  if (!tx.date) return false;
  const d = new Date(tx.date + "T00:00:00");
  return d.getFullYear() === year && d.getMonth() === month;
}
function escapeHTML(str) {
  return String(str).replace(/[&<>"']/g, function(m) {
    return { "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[m];
  });
}

document.querySelectorAll(".nav-link").forEach(function(link) {
  link.addEventListener("click", function(e) {
    e.preventDefault();
    const view = link.getAttribute("data-view");
    document.querySelectorAll(".nav-link").forEach(function(l) { l.classList.remove("active"); });
    document.querySelectorAll(".view").forEach(function(v) { v.classList.remove("active"); });
    link.classList.add("active");
    const viewEl = document.getElementById("view-" + view);
    if (viewEl) viewEl.classList.add("active");
    if (view === "dashboard")    renderDashboard();
    if (view === "transactions") renderAllTransactions();
  });
});

document.getElementById("prevMonth").addEventListener("click", function() {
  currentMonth--;
  if (currentMonth < 0) { currentMonth = 11; currentYear--; }
  renderDashboard();
});
document.getElementById("nextMonth").addEventListener("click", function() {
  currentMonth++;
  if (currentMonth > 11) { currentMonth = 0; currentYear++; }
  renderDashboard();
});

document.getElementById("clearData").addEventListener("click", function() {
  if (confirm("Är du säker på att du vill radera all data?")) {
    transactions = [];
    saveTransactions();
    renderDashboard();
    renderAllTransactions();
  }
});

document.querySelectorAll(".toggle-btn").forEach(function(btn) {
  btn.addEventListener("click", function() {
    currentType = btn.getAttribute("data-type");
    document.querySelectorAll(".toggle-btn").forEach(function(b) { b.classList.remove("active"); });
    btn.classList.add("active");
    populateCategorySelect();
  });
});

function populateCategorySelect() {
  const sel  = document.getElementById("txCategory");
  const cats = CATEGORIES[currentType] || [];
  sel.innerHTML = cats.map(function(c) {
    return '<option value="' + c.id + '">' + c.icon + ' ' + c.label + '</option>';
  }).join("");
}

function populateFilterCategory() {
  const sel = document.getElementById("filterCategory");
  const allCats = CATEGORIES.expense.concat(CATEGORIES.income);
  const seen = {};
  const unique = allCats.filter(function(c) {
    if (seen[c.id]) return false;
    seen[c.id] = true;
    return true;
  });
  sel.innerHTML = '<option value="all">All categories</option>' +
    unique.map(function(c) {
      return '<option value="' + c.id + '">' + c.icon + ' ' + c.label + '</option>';
    }).join("");
}

document.getElementById("submitTx").addEventListener("click", function() {
  const desc     = document.getElementById("txDesc").value.trim();
  const amount   = parseFloat(document.getElementById("txAmount").value);
  const date     = document.getElementById("txDate").value;
  const category = document.getElementById("txCategory").value;
  const note     = document.getElementById("txNote").value.trim();

  if (!desc)                { showFeedback("⚠ Ange en beskrivning.", "error"); return; }
  if (!amount || amount <= 0) { showFeedback("⚠ Ange ett giltigt belopp.", "error"); return; }
  if (!date)                { showFeedback("⚠ Välj ett datum.", "error"); return; }

  const tx = {
    id: Date.now(),
    type: currentType,
    desc: desc,
    amount: amount,
    date: date,
    category: category,
    note: note,
  };
  transactions.unshift(tx);
  saveTransactions();

  document.getElementById("txDesc").value   = "";
  document.getElementById("txAmount").value = "";
  document.getElementById("txNote").value   = "";
  showFeedback("✓ Transaktion tillagd!", "success");
});

function showFeedback(msg, type) {
  const el = document.getElementById("formFeedback");
  el.textContent = msg;
  el.style.color = type === "error" ? "#f0657a" : "#2dd4aa";
  setTimeout(function() { el.textContent = ""; }, 3000);
}

document.getElementById("filterType").addEventListener("change",     applyFilters);
document.getElementById("filterCategory").addEventListener("change", applyFilters);
document.getElementById("filterSearch").addEventListener("input",    applyFilters);

function applyFilters() {
  const typeFilter     = document.getElementById("filterType").value;
  const categoryFilter = document.getElementById("filterCategory").value;
  const search         = document.getElementById("filterSearch").value.toLowerCase();

  let list = transactions.slice();
  if (typeFilter !== "all")     list = list.filter(function(t) { return t.type === typeFilter; });
  if (categoryFilter !== "all") list = list.filter(function(t) { return t.category === categoryFilter; });
  if (search) list = list.filter(function(t) {
    return t.desc.toLowerCase().includes(search) || (t.note || "").toLowerCase().includes(search);
  });

  const container = document.getElementById("allTxList");
  if (!list.length) {
    container.innerHTML = '<p class="empty-state">Inga transaktioner matchar filtret.</p>';
    return;
  }
  container.innerHTML = list.map(txHTML).join("");
  attachDeleteListeners(container);
}

function renderAllTransactions() { applyFilters(); }

function txHTML(tx) {
  const cat  = getCategoryInfo(tx.type, tx.category);
  const sign = tx.type === "income" ? "+" : "−";
  return '<div class="tx-item" data-id="' + tx.id + '">' +
    '<div class="tx-icon ' + tx.type + '">' + cat.icon + '</div>' +
    '<div class="tx-info">' +
      '<div class="tx-desc">' + escapeHTML(tx.desc) + '</div>' +
      '<div class="tx-meta">' + cat.label + ' · ' + formatDate(tx.date) +
        (tx.note ? ' · ' + escapeHTML(tx.note) : '') + '</div>' +
    '</div>' +
    '<div class="tx-amount ' + tx.type + '">' + sign + formatSEK(tx.amount) + '</div>' +
    '<button class="tx-delete" aria-label="Ta bort">✕</button>' +
  '</div>';
}

function attachDeleteListeners(container) {
  container.querySelectorAll(".tx-delete").forEach(function(btn) {
    btn.addEventListener("click", function() {
      const id = parseInt(btn.closest(".tx-item").getAttribute("data-id"));
      transactions = transactions.filter(function(t) { return t.id !== id; });
      saveTransactions();
      renderDashboard();
      renderAllTransactions();
    });
  });
}

function renderDashboard() {
  document.getElementById("currentMonthLabel").textContent = monthLabel(currentYear, currentMonth);

  const monthTx      = transactions.filter(function(tx) { return txInMonth(tx, currentYear, currentMonth); });
  const totalIncome  = monthTx.filter(function(t) { return t.type === "income"; }).reduce(function(s,t) { return s+t.amount; }, 0);
  const totalExpense = monthTx.filter(function(t) { return t.type === "expense"; }).reduce(function(s,t) { return s+t.amount; }, 0);
  const balance      = totalIncome - totalExpense;

  document.getElementById("totalIncome").textContent  = formatSEK(totalIncome);
  document.getElementById("totalExpense").textContent = formatSEK(totalExpense);
  const balEl = document.getElementById("totalBalance");
  balEl.textContent = formatSEK(balance);
  balEl.style.color = balance >= 0 ? "#2dd4aa" : "#f0657a";

  renderRecentList(monthTx.slice(0, 6));
  renderBarChart();
  renderPieChart(monthTx);
}

function renderRecentList(txList) {
  const container = document.getElementById("recentTxList");
  if (!txList.length) {
    container.innerHTML = '<p class="empty-state">Inga transaktioner den här månaden.</p>';
    return;
  }
  container.innerHTML = txList.map(txHTML).join("");
  attachDeleteListeners(container);
}

function renderBarChart() {
  const canvas = document.getElementById("barChart");
  if (!canvas) return;
  const months      = [];
  const incomeData  = [];
  const expenseData = [];

  for (let i = 5; i >= 0; i--) {
    let m = currentMonth - i;
    let y = currentYear;
    while (m < 0) { m += 12; y--; }
    months.push(new Date(y, m, 1).toLocaleDateString("sv-SE", { month: "short" }));
    const mTx = transactions.filter(function(tx) { return txInMonth(tx, y, m); });
    incomeData.push( mTx.filter(function(t){return t.type==="income";}).reduce(function(s,t){return s+t.amount;},0));
    expenseData.push(mTx.filter(function(t){return t.type==="expense";}).reduce(function(s,t){return s+t.amount;},0));
  }

  if (barChartInst) { barChartInst.destroy(); barChartInst = null; }
  barChartInst = new Chart(canvas, {
    type: "bar",
    data: {
      labels: months,
      datasets: [
        { label: "Inkomster", data: incomeData,  backgroundColor: "rgba(45,212,170,0.75)", borderRadius: 6 },
        { label: "Utgifter",  data: expenseData, backgroundColor: "rgba(240,101,122,0.75)", borderRadius: 6 },
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: true,
      plugins: { legend: { labels: { color: "#7a7d96", font: { size: 12 } } } },
      scales: {
        x: { ticks: { color: "#7a7d96" }, grid: { color: "rgba(255,255,255,0.04)" } },
        y: { ticks: { color: "#7a7d96", callback: function(v) { return v.toLocaleString("sv-SE") + " kr"; } }, grid: { color: "rgba(255,255,255,0.04)" } },
      }
    }
  });
}

function renderPieChart(monthTx) {
  const canvas   = document.getElementById("pieChart");
  const legendEl = document.getElementById("pieLegend");
  if (!canvas || !legendEl) return;

  const expenses = monthTx.filter(function(t) { return t.type === "expense"; });
  const totals   = {};
  expenses.forEach(function(t) { totals[t.category] = (totals[t.category] || 0) + t.amount; });
  const entries  = Object.entries(totals).sort(function(a,b) { return b[1]-a[1]; });

  if (!entries.length) {
    if (pieChartInst) { pieChartInst.destroy(); pieChartInst = null; }
    canvas.style.display = "none";
    legendEl.innerHTML   = '<p class="empty-state" style="font-size:13px">Inga utgifter denna månad.</p>';
    return;
  }

  canvas.style.display = "";
  const labels = entries.map(function(e) { return getCategoryInfo("expense", e[0]).label; });
  const data   = entries.map(function(e) { return e[1]; });
  const colors = entries.map(function(e, i) { return CATEGORY_COLORS[i % CATEGORY_COLORS.length]; });

  if (pieChartInst) { pieChartInst.destroy(); pieChartInst = null; }
  pieChartInst = new Chart(canvas, {
    type: "doughnut",
    data: {
      labels: labels,
      datasets: [{ data: data, backgroundColor: colors, borderWidth: 0, hoverOffset: 6 }]
    },
    options: {
      responsive: true,
      cutout: "68%",
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: { label: function(ctx) { return " " + formatSEK(ctx.parsed); } } }
      }
    }
  });

  legendEl.innerHTML = entries.map(function(e, i) {
    const cat = getCategoryInfo("expense", e[0]);
    return '<div class="legend-item">' +
      '<span class="legend-dot" style="background:' + colors[i] + '"></span>' +
      cat.label + ' — ' + formatSEK(e[1]) +
      '</div>';
  }).join("");
}

function seedDemoData() {
  if (transactions.length > 0) return;
  const now  = new Date();
  const y    = now.getFullYear();
  const m    = String(now.getMonth() + 1).padStart(2, "0");
  const demo = [
    { type:"income",  desc:"Salary",           amount:32000, date:y+"-"+m+"-25", category:"salary",         note:"" },
    { type:"expense", desc:"ICA Maxi",       amount:1450,  date:y+"-"+m+"-20", category:"groceries",         note:"Weekly food" },
    { type:"expense", desc:"Rent",           amount:8500,  date:y+"-"+m+"-01", category:"home",      note:"" },
    { type:"expense", desc:"SL-card",        amount:890,   date:y+"-"+m+"-02", category:"transport",   note:"" },
    { type:"expense", desc:"Netflix",        amount:179,   date:y+"-"+m+"-05", category:"subscription",  note:"" },
    { type:"expense", desc:"Sushi",     amount:320,   date:y+"-"+m+"-15", category:"restaurant",  note:"Lunch with colleagues" },
    { type:"expense", desc:"Gymcard",        amount:399,   date:y+"-"+m+"-03", category:"health",       note:"" },
    { type:"income",  desc:"Freelance Mission", amount:5000,  date:y+"-"+m+"-10", category:"freelance",   note:"Project" },
  ];
  demo.forEach(function(t, i) { t.id = Date.now() + i; });
  transactions = demo;
  saveTransactions();
}

function init() {
  seedDemoData();
  const today = new Date().toISOString().split("T")[0];
  document.getElementById("txDate").value = today;
  populateCategorySelect();
  populateFilterCategory();
  renderDashboard();
}

init();

});
</script>
  
</body>
</html>
